<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tout les Réseaux Sociaux - Miyu</title>
  <meta name="description" content="Panels Twitch prêts avec logos officiels et liens configurables." />
  <link rel="icon" type="image/png" href="./sakuraFavicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --text: #f4f8ff;
      --panel: rgba(9, 15, 24, 0.72);
      --panel-border: rgba(255, 255, 255, 0.16);
      --row-hover: rgba(255, 255, 255, 0.1);
      --muted: rgba(238, 244, 255, 0.9);
      --row-border: rgba(255, 255, 255, 0.12);
      --glow: 0 10px 22px rgba(7, 13, 25, 0.45);
      --panel-width: 320px;
      --panel-height: 100px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Nunito", sans-serif;
      color: var(--text);
      background:
        linear-gradient(rgba(3, 7, 26, 0.44), rgba(3, 7, 26, 0.78)),
        url("./Sakura_Hill_Offline_JPG0.jpg") center / cover no-repeat;
      padding: 24px;
    }

    .wrap {
      width: min(940px, 100%);
    }

    .panel {
      width: 100%;
      border-radius: 18px;
      border: 1px solid var(--panel-border);
      background: var(--panel);
      box-shadow: 0 16px 40px rgba(2, 6, 13, 0.6);
      backdrop-filter: blur(7px);
      padding: 26px 26px 24px;
      animation: panelIn 500ms ease;
    }

    .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .badge {
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.07);
      color: #fef3c7;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.35rem, 2.8vw, 1.95rem);
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    .subtitle {
      margin: 8px 0 22px;
      color: var(--muted);
      font-size: 1rem;
    }

    .social-links {
      list-style: none;
      padding: 0;
      margin: 0 0 6px;
      display: grid;
      gap: 12px;
      justify-content: center;
    }

    .social-links a {
      display: flex;
      align-items: center;
      gap: 12px;
      width: var(--panel-width);
      min-height: auto;
      border-radius: 14px;
      padding: 14px 16px;
      color: var(--text);
      text-decoration: none;
      border: 1px solid var(--row-border);
      box-shadow: var(--glow);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.01));
      transition: background-color 0.18s ease, transform 0.18s ease, border-color 0.2s ease;
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.25;
    }

    .icon-wrap {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .icon-wrap img {
      width: 16px;
      height: 16px;
      display: block;
    }

    .social-links a:hover {
      background: var(--row-hover);
      transform: translateX(4px);
      border-color: rgba(255, 255, 255, 0.28);
    }

    .footer {
      margin: 22px 0 0;
      color: var(--muted);
      font-size: 1.02rem;
      font-weight: 700;
      line-height: 1.4;
    }

    @keyframes panelIn {
      from {
        opacity: 0;
        transform: translateY(14px) scale(0.99);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (max-width: 560px) {
      .panel {
        padding: 20px 16px;
      }

      :root {
        --panel-width: 100%;
        --panel-height: 92px;
      }

      .label {
        font-size: 1rem;
      }

      .social-links a {
        width: 100%;
      }

      .footer {
        font-size: 0.97rem;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <main class="panel" aria-label="Panel social">
      <div class="head">
        <h1>Retrouve Miyu en dehors des lives !</h1>
      </div>

      <ul id="socialLinks" class="social-links" aria-label="Liens réseaux sociaux"></ul>

      <p class="footer">Viens me retrouver pour ne rien manquer des prochaines aventures !</p>
    </main>
  </div>

  <script>
    const links = [
      {
        name: "Instagram",
        href: "https://www.instagram.com/princesse_kitsune",
        logo: "https://cdn.simpleicons.org/instagram/E4405F"
      },
      {
        name: "TikTok",
        href: "https://www.tiktok.com/@princesse_kitsune",
        logo: "https://cdn.simpleicons.org/tiktok/FFFFFF"
      },
      {
        name: "X / Twitter",
        href: "https://x.com/kitsunette559",
        logo: "https://cdn.simpleicons.org/x/FFFFFF"
      },
      {
        name: "Discord",
        href: "https://discord.gg/7KyxTPEwXv",
        logo: "https://cdn.simpleicons.org/discord/5865F2"
      }
    ];

    const list = document.getElementById("socialLinks");

    for (const item of links) {
      const li = document.createElement("li");
      li.innerHTML = `
        <a href="${item.href}" target="_blank" rel="noopener noreferrer" aria-label="${item.name}">
          <span class="icon-wrap"><img src="${item.logo}" alt="${item.name}" /></span>
          <span>${item.name}</span>
        </a>
      `;
      list.appendChild(li);
    }
  </script>
</body>
</html>
